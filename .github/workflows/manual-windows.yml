# SPDX-License-Identifier: GPL-3.0-or-later
name: Compilar NectarLink para Windows

on:
  workflow_dispatch:
    inputs:
      arquitectura:
        description: "Arquitectura de Windows"
        required: true
        default: "x64"
        type: choice
        options:
          - x64
          - arm64

permissions:
  contents: read

concurrency:
  group: nectarlink-manual-windows-${{ github.ref }}-${{ inputs.arquitectura }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  windows:
    name: Compilar instalador de Windows (${{ inputs.arquitectura }})
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Rust
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install }
          if ("\${{ inputs.arquitectura }}" -eq "arm64") {
            rustup target add aarch64-pc-windows-msvc
          }

      - name: Preparar caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: manual-windows-${{ inputs.arquitectura }}

      - name: Instalar Qt 6.12.0 MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ inputs.arquitectura == 'arm64' && 'win64_msvc2022_arm64_cross_compiled' || 'win64_msvc2022_64' }}
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git

      - name: Instalar NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
          }

      - name: Compilar y empaquetar
        shell: pwsh
        run: |
          if ("\${{ inputs.arquitectura }}" -eq "arm64") {
            ./scripts/package.ps1 -Arch arm64
          } else {
            ./scripts/package.ps1
          }

      - name: Comprobar que se generó el instalador
        shell: pwsh
        run: |
          $files = Get-ChildItem target/package/*-setup.exe -ErrorAction SilentlyContinue
          if (-not $files) { throw "No se generó ningún instalador." }
          $files | ForEach-Object {
            Write-Host ("Generado: {0} ({1:N1} MB)" -f $_.FullName, ($_.Length / 1MB))
          }

      - name: Guardar instalador descargable
        uses: actions/upload-artifact@v7
        with:
          name: nectarlink-windows-${{ inputs.arquitectura }}
          path: target/package/*-setup.exe
          if-no-files-found: error
          retention-days: 14
