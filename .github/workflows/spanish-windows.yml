# SPDX-License-Identifier: GPL-3.0-or-later
name: Compilar NectarLink en español (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/app/i18n/nectarlink_es_MX.ts"
      - "desktop/app/src/i18n.rs"
      - ".github/workflows/spanish-windows.yml"

permissions:
  contents: read

concurrency:
  group: nectarlink-spanish-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  windows:
    name: Compilar instalador Windows x64 (Español)
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar Rust
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install }

      - name: Preparar caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: spanish-windows-x64

      - name: Instalar Qt 6.12.0 MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git

      - name: Instalar NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
          }

      - name: Compilar y empaquetar
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Comprobar instalador
        shell: pwsh
        run: |
          $files = Get-ChildItem target/package/*-setup.exe -ErrorAction SilentlyContinue
          if (-not $files) { throw "No se generó ningún instalador." }
          $files | ForEach-Object {
            Write-Host ("Generado: {0} ({1:N1} MB)" -f $_.FullName, ($_.Length / 1MB))
          }

      - name: Publicar instalador descargable
        uses: actions/upload-artifact@v7
        with:
          name: nectarlink-windows-es-MX
          path: target/package/*-setup.exe
          if-no-files-found: error
          retention-days: 14
